[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-analytics-sql"
version = "1.0.0"
description = "A People/Talent analytics warehouse in SQL: schema, seeded synthetic data, 28 documented queries, tests and benchmarks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Money Chanalia" }]
requires-python = ">=3.11"
dependencies = []                      # standard library only
keywords = ["sql", "sqlite", "people-analytics", "window-functions", "recursive-cte"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.scripts]
talentsql = "talentsql.cli:main"

[tool.setuptools]
packages = ["talentsql"]
